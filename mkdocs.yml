# site_name: LLM-finetuning
# theme:
#   name: material
# nav:
#   - 首页: index.md
#   - SFT 监督微调: sft.md
#   - GRPO: grpo.md

site_name: LLM-finetuning
site_url: https://lxxxr0.github.io/LLM-finetuning/
site_description: 大模型后训练笔记 SFT/GRPO/RLHF

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换暗色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换亮色模式

plugins:
  - search:
      lang: zh

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# ========== 这里就是侧边导航，新增md文件就在这里加一行 ==========
nav:
  - 首页: index.md
  - 大模型Post-Training指南: 从SFT到GRPO的完整技术栈与实践.md
  - 大模型文档抽取指南: 利用大语言模型的能力进行实体关系抽取.md
  - 大模型RL冷启动指南: DeepSeek-R1精读：强化学习训练失控与GRPO冷启动破局.md

